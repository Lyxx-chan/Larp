<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larp Larp Larp</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #131b2e;
            --border-color: #243049;
            --accent: #ef4444;
            --accent-hover: #dc2626;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-dark) 60%);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 20px;
            overflow: hidden;
            transition: background 0.2s ease;
        }

        /* Efek RGB Chaos saat prank aktif */
        body.rgb-mode {
            background-image: none;
            animation: rgbBg 0.6s linear infinite;
        }

        body.rgb-mode .kartu {
            animation: rgbBorder 0.6s linear infinite, shake 0.3s ease-in-out infinite;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
        }

        .kartu {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 36px 28px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 10;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(239, 68, 68, 0.12);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 999px;
            margin-bottom: 18px;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        h1 {
            color: var(--text-primary);
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        button.primary-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
            transition: all 0.2s ease;
        }

        button.primary-btn:hover {
            background-color: var(--accent-hover);
        }

        .fake-exit {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #0f172a;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: none;
            z-index: 20;
            transition: top 0.12s ease, left 0.12s ease;
        }

        /* Ukuran minimal 200x200 agar tidak diblokir YouTube, tapi dibuat transparan */
        #yt-wrapper {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 200px;
            height: 200px;
            opacity: 0.01;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes rgbBg {
            0%   { background-color: #ff0055; }
            20%  { background-color: #ff9900; }
            40%  { background-color: #33ff00; }
            60%  { background-color: #00ffff; }
            80%  { background-color: #7700ff; }
            100% { background-color: #ff0055; }
        }

        @keyframes rgbBorder {
            0%   { border-color: #00ffff; box-shadow: 0 0 35px #00ffff; }
            33%  { border-color: #ff0055; box-shadow: 0 0 35px #ff0055; }
            66%  { border-color: #33ff00; box-shadow: 0 0 35px #33ff00; }
            100% { border-color: #00ffff; box-shadow: 0 0 35px #00ffff; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-4px, 3px) rotate(-1deg); }
            50% { transform: translate(4px, -3px) rotate(1deg); }
            75% { transform: translate(-3px, -3px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div id="yt-wrapper">
        <div id="player"></div>
    </div>

    <button id="fakeExitBtn" class="fake-exit">✕ Exit Fullscreen</button>

    <main id="card" class="kartu">
        <div class="badge">
            <span class="dot"></span>
            <span id="statusText">System Ready</span>
        </div>
        <h1 id="titleText">Attention Larpers!</h1>
        <p id="descText">Keep larping, cuz <strong>Nothing Ever Happens</strong>.</p>
        <button id="larpBtn" class="primary-btn">Click Me</button>
    </main>

    <!-- URL resmi YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const btn = document.getElementById('larpBtn');
        const fakeExitBtn = document.getElementById('fakeExitBtn');
        const statusText = document.getElementById('statusText');
        const titleText = document.getElementById('titleText');
        const descText = document.getElementById('descText');

        let isPrankActive = false;
        let escapeCount = 0;
        let ytPlayer;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', {
                height: '200',
                width: '200',
                videoId: 'dQw4w9WgXcQ',
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'playsinline': 1,
                    'loop': 1,
                    'playlist': 'dQw4w9WgXcQ'
                }
            });
        }

        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
        }

        function moveFakeExit() {
            escapeCount++;
            const maxX = window.innerWidth - fakeExitBtn.offsetWidth - 20;
            const maxY = window.innerHeight - fakeExitBtn.offsetHeight - 20;
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            fakeExitBtn.style.right = 'auto';
            fakeExitBtn.style.left = `${randomX}px`;
            fakeExitBtn.style.top = `${randomY}px`;

            if (escapeCount === 3) {
                fakeExitBtn.textContent = 'Nice try 😂';
            } else if (escapeCount === 6) {
                fakeExitBtn.textContent = 'Can’t touch this!';
            }
        }

        btn.addEventListener('click', () => {
            enterFullscreen();
            isPrankActive = true;

            document.body.classList.add('rgb-mode');

            if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                ytPlayer.unMute();
                ytPlayer.setVolume(100);
                ytPlayer.playVideo();
            }

            statusText.textContent = 'RGB LARP OVERDRIVE';
            titleText.textContent = 'LARP ALERT !!!';
            descText.innerHTML = 'Enjoy the <strong>Infinite RGB Larp</strong>. Turn up your volume!';
            btn.textContent = 'LOUDER !!!';
            fakeExitBtn.style.display = 'block';
        });

        fakeExitBtn.addEventListener('mouseover', moveFakeExit);
        fakeExitBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveFakeExit();
        });

        document.addEventListener('click', (e) => {
            if (isPrankActive && !document.fullscreenElement && e.target !== fakeExitBtn) {
                enterFullscreen();
            }
        });

        window.addEventListener('beforeunload', (e) => {
            if (isPrankActive) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>

</body>
</html>
